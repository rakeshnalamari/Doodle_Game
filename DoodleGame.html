<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump</title>
    <link rel="stylesheet" href="DoodleGame.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="score-container">
            <span id="score">Score: 0</span>
            <span id="high-score">High Score: 0</span>
        </div>
        <div id="game-over-container" style="display: none;">
            <h1>Game Over!</h1>
            <span id="final-score">Your Score: 0</span>
            <button id="restartBtn" onclick="restartGame()">Restart</button>
        </div>
        <audio id="jumpSound" src="jump.mp3"></audio>
        <audio id="gameOverSound" src="gameover.mp3"></audio>
        <audio id="powerupSound" src="powerup.mp3"></audio>
    </div>
    <script src="DoodleGame.js"></script>
</body>
</html>
